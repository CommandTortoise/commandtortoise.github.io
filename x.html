<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>致我唯一的星辰</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a2a;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 800px;
            padding: 2rem;
            background: rgba(10, 10, 42, 0.7);
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(255, 105, 180, 0.3);
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 1.5rem;
            background: linear-gradient(45deg, #ff69b4, #9370db, #00bfff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: glow 2s ease-in-out infinite alternate;
        }

        .message {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 2rem;
            opacity: 0;
            animation: fadeIn 2s forwards 1s;
        }

        .heart-container {
            position: relative;
            width: 100%;
            height: 200px;
            margin: 2rem 0;
        }

        .heart {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            background: linear-gradient(45deg, #ff69b4, #ff1493);
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.7);
            animation: heartbeat 1.5s ease-in-out infinite both;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .heart:hover {
            transform: translate(-50%, -50%) scale(1.2);
            box-shadow: 0 0 30px rgba(255, 105, 180, 0.9);
        }

        .heart:before,
        .heart:after {
            content: '';
            position: absolute;
            width: 100px;
            height: 100px;
            background: linear-gradient(45deg, #ff69b4, #ff1493);
            border-radius: 50%;
        }

        .heart:before {
            top: -50px;
            left: 0;
        }

        .heart:after {
            top: 0;
            left: 50px;
        }

        .heart-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-weight: bold;
            z-index: 1;
        }

        .signature {
            font-style: italic;
            margin-top: 2rem;
            opacity: 0;
            animation: fadeIn 2s forwards 2s;
        }

        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle 5s infinite;
        }

        .continue-btn {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 10px 25px;
            background: linear-gradient(45deg, #ff69b4, #9370db);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(255, 105, 180, 0.5);
            transition: transform 0.3s, box-shadow 0.3s;
            opacity: 0;
            animation: fadeIn 2s forwards 2.5s;
        }

        .continue-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.8);
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 10px #ff69b4, 0 0 20px #ff69b4, 0 0 30px #ff69b4;
            }
            to {
                text-shadow: 0 0 15px #ff69b4, 0 0 25px #ff69b4, 0 0 35px #ff69b4;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes heartbeat {
            0% { transform: translate(-50%, -50%) scale(1); }
            5% { transform: translate(-50%, -50%) scale(1.1); }
            10% { transform: translate(-50%, -50%) scale(1); }
            15% { transform: translate(-50%, -50%) scale(1.2); }
            50% { transform: translate(-50%, -50%) scale(1); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; }
           50% { opacity: 1; }
        }

        .love-particle {
            position: absolute;
            font-size: 20px;
            color: #ff69b4;
            pointer-events: none;
            z-index: 5;
            animation: float 5s linear forwards;
        }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    
    <div class="container">
        <h1>致 七霜</h1>
        
        <div class="message">
            <p>遇见你之前，我的世界是黑白的</p>
            <p>直到你的出现，像一道绚烂的彩虹，</p>
            <p>让我的生命充满了色彩与光芒</p>
            <p>与你在一起的每一刻，都如同星辰般闪耀，</p>
            <p>在我心中留下永恒的印记</p>
        </div>
        
        <div class="heart-container">
            <div class="heart" id="heart">
                <div class="heart-text">❤️</div>
            </div>
        </div>
        
        <div class="signature">
            <p>永远爱你的，</p>
            <p>CT</p>
        </div>
        
        <a href="v.html" class="continue-btn">点击♡→</a>
    </div>
    <script>
        // 创建星星背景
        function createStars() {
            const starsContainer = document.getElementById('stars');
            const starCount = 200;
            
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                
                // 随机位置和大小
                const size = Math.random() * 3;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                
                // 随机动画延迟
                star.style.animationDelay = `${Math.random() * 5}s`;
                
                starsContainer.appendChild(star);
            }
        }
        
        // 爱心点击效果
        function setupHeartInteraction() {
            const heart = document.getElementById('heart');
            let clickCount = 0;
            
            heart.addEventListener('click', function(e) {
                clickCount++;
                
                // 创建爱心粒子
                for (let i = 0; i < 5; i++) {
                    createLoveParticle(e.clientX, e.clientY);
                }
                
                // 改变爱心颜色
                const colors = [
                    'linear-gradient(45deg, #ff69b4, #ff1493)',
                    'linear-gradient(45deg, #9370db, #8a2be2)',
                    'linear-gradient(45deg, #00bfff, #1e90ff)',
                    'linear-gradient(45deg, #32cd32, #00ff00)',
                    'linear-gradient(45deg, #ffd700, #ffa500)'
                ];
                
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                heart.style.background = randomColor;
                heart.style.boxShadow = `0 0 20px ${randomColor.split(',')[1].trim()}`;
                
                // 每点击5次显示一条消息
                if (clickCount % 5 === 0) {
                    showRandomMessage();
                }
            });
        }
        
        // 创建爱心粒子
        function createLoveParticle(x, y) {
            const particle = document.createElement('div');
            particle.classList.add('love-particle');
            particle.textContent = '❤️';
            particle.style.left = `${x}px`;
            particle.style.top = `${y}px`;
            
            document.body.appendChild(particle);
            
            // 动画结束后移除元素
            setTimeout(() => {
                particle.remove();
            }, 5000);
        }
        
        // 显示随机消息
        function showRandomMessage() {
            const messages = [
                "你是我生命中最美的意外",
                "每一天都比前一天更爱你",
                "我的世界因你而完整",
                "你是我永恒的星辰",
                "与你相遇，是我此生最大的幸运",
                "爱你，是我做过最正确的事"
            ];
            
            const randomMessage = messages[Math.floor(Math.random() * messages.length)];
            
            // 创建浮动消息
            const messageElement = document.createElement('div');
            messageElement.textContent = randomMessage;
            messageElement.style.position = 'fixed';
            messageElement.style.left = '50%';
            messageElement.style.top = '50%';
            messageElement.style.transform = 'translate(-50%, -50%)';
            messageElement.style.color = '#ff69b4';
            messageElement.style.fontSize = '1.5rem';
            messageElement.style.fontWeight = 'bold';
            messageElement.style.zIndex = '100';
            messageElement.style.textShadow = '0 0 10px rgba(255, 105, 180, 0.7)';
            messageElement.style.animation = 'fadeIn 2s, fadeOut 2s 3s forwards';
            
            document.body.appendChild(messageElement);
            
            // 5秒后移除消息
            setTimeout(() => {
                messageElement.remove();
            }, 5000);
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            createStars();
            setupHeartInteraction();
        });
    </script>
</body>
</html>
